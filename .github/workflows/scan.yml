name: Nightly scan

on:
  schedule:
    # 22:30 UTC Mon–Fri = 6:30 pm New York (EDT) / 5:30 pm (EST), after the close
    - cron: "30 22 * * 1-5"
    # Backup before the next open (8:15 am EDT / 7:15 am EST, Tue–Sat): GitHub can delay
    # the evening run for hours and Yahoo sometimes lags; an older scan never replaces a newer one.
    - cron: "15 12 * * 2-6"
  workflow_dispatch: {}   # "Run workflow" button for manual scans (safe any time: a live bar is ignored)

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      # Exits non-zero on a bad data day, which leaves the previous scan published.
      - name: Scan Nasdaq-100 and S&P 500
        run: python scanner/scan.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/setups.json scanner/universe_cache.json
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Scan $(date -u +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
